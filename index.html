<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --panel: #ffffff;
        --display: #101827;
        --display-text: #f9fafb;
        --button: #e5e7eb;
        --button-hover: #d1d5db;
        --operator: #f59e0b;
        --operator-hover: #d97706;
        --accent: #2563eb;
        --danger: #ef4444;
        --text: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #e0f2fe, #f3f4f6);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .calculator {
        width: min(92vw, 360px);
        background: var(--panel);
        border-radius: 22px;
        box-shadow: 0 20px 45px rgba(17, 24, 39, 0.18);
        padding: 18px;
      }

      .display {
        background: var(--display);
        color: var(--display-text);
        min-height: 88px;
        border-radius: 16px;
        display: flex;
        align-items: end;
        justify-content: flex-end;
        padding: 18px 16px;
        margin-bottom: 18px;
        overflow: hidden;
      }

      #output {
        font-size: clamp(2rem, 6vw, 2.7rem);
        word-break: break-all;
        text-align: right;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 20px 10px;
        font-size: 1.4rem;
        cursor: pointer;
        background: var(--button);
        color: var(--text);
        transition: transform 0.12s ease, background 0.12s ease;
      }

      button:hover {
        background: var(--button-hover);
      }

      button:active {
        transform: translateY(1px) scale(0.99);
      }

      .operator {
        background: var(--operator);
        color: #fff;
      }

      .operator:hover {
        background: var(--operator-hover);
      }

      .clear {
        background: #fee2e2;
        color: #991b1b;
      }

      .clear:hover {
        background: #fecaca;
      }

      .equals {
        background: var(--accent);
        color: white;
      }

      .equals:hover {
        background: #1d4ed8;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <div id="output">0</div>
      </div>

      <div class="buttons">
        <button class="clear" data-action="clear">C</button>
        <button class="clear" data-action="delete">⌫</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equals" data-action="equals">=</button>

        <button class="zero" data-value="0">0</button>
        <button data-value=".">.</button>
      </div>
    </div>

    <script>
      const output = document.getElementById('output');
      let expression = '';

      function updateDisplay() {
        output.textContent = expression || '0';
      }

      function appendValue(value) {
        const lastChar = expression.slice(-1);

        if (value === '.' && lastChar === '.') return;
        if (['+', '-', '*', '/'].includes(value) && ['+', '-', '*', '/'].includes(lastChar)) {
          expression = expression.slice(0, -1) + value;
          updateDisplay();
          return;
        }

        expression += value;
        updateDisplay();
      }

      function clearExpression() {
        expression = '';
        updateDisplay();
      }

      function deleteLast() {
        expression = expression.slice(0, -1);
        updateDisplay();
      }

      function calculate() {
        if (!expression) return;

        const safeExpression = expression.replace(/×/g, '*').replace(/÷/g, '/');
        const validPattern = /^[\d+\-*/.()\s]+$/;

        if (!validPattern.test(safeExpression)) {
          expression = 'Error';
          updateDisplay();
          return;
        }

        try {
          const result = Function(`"use strict"; return (${safeExpression});`)();
          expression = Number.isFinite(result) ? String(result) : 'Error';
        } catch {
          expression = 'Error';
        }

        updateDisplay();
      }

      document.querySelectorAll('button').forEach((button) => {
        button.addEventListener('click', () => {
          const value = button.dataset.value;
          const action = button.dataset.action;

          if (value) {
            appendValue(value);
            return;
          }

          if (action === 'clear') {
            clearExpression();
          } else if (action === 'delete') {
            deleteLast();
          } else if (action === 'equals') {
            calculate();
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        const { key } = event;

        if (/^[0-9]$/.test(key) || ['+', '-', '*', '/', '.'].includes(key)) {
          appendValue(key);
        } else if (key === 'Enter' || key === '=') {
          calculate();
        } else if (key === 'Backspace') {
          deleteLast();
        } else if (key.toLowerCase() === 'c') {
          clearExpression();
        }
      });
    </script>
  </body>
</html>
